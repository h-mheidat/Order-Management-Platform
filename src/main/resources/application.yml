spring:
  application:
    name: orders

  # Every value below reads from the environment with a local-dev fallback. Nothing secret is
  # committed, and deploying to another environment is a matter of env vars, not a file edit.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:orders}
    username: ${POSTGRES_USER:orders_app}
    password: ${POSTGRES_PASSWORD:change_me_locally}
    hikari:
      # Pinned rather than left to the default of 10. The pool is the real concurrency limit of
      # the service: N instances x max-pool-size must stay under Postgres max_connections.
      maximum-pool-size: 10
      minimum-idle: 2
      # Fail fast when the pool is exhausted instead of piling up request threads.
      connection-timeout: 3000
      max-lifetime: 1800000
      pool-name: oms-hikari

  jpa:
    # Flyway owns the schema; Hibernate only checks that its mappings match what Flyway built.
    # `validate` turns a mapping/migration mismatch into a startup failure instead of a
    # confusing runtime error on the first query that touches the wrong column. Never `update`:
    # that lets Hibernate silently alter a production schema.
    hibernate:
      ddl-auto: validate
    # Off deliberately. With open-in-view enabled the EntityManager stays open for the whole
    # request, lazy loads silently succeed inside the view layer, and N+1 problems become
    # invisible until production. Off means LazyInitializationException surfaces at dev time.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Batch writes; required later for the order-items insert to be one round trip.
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Fail loudly if any query returns entities in memory pagination mode.
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change_me_locally}
      # Both timeouts are short on purpose: a cache is an optimisation, so an unavailable Redis
      # must fail in milliseconds and let the request fall through to Postgres, not hold a
      # request thread hostage. Stage 7 adds the fallback behaviour itself.
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

  kafka:
    # The host-facing listener from docker-compose.yml (PLAINTEXT_HOST). Inside a container
    # this becomes kafka:9092 via KAFKA_BOOTSTRAP_SERVERS.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    client-id: ${spring.application.name}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:orders-service}
      auto-offset-reset: earliest
      # Acknowledgement is handled by the container, not by the broker's auto-commit timer:
      # auto-commit can acknowledge a record whose handler later threw.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the real one. Without it, a message that cannot be
      # deserialized throws before the listener is ever reached, so no error handler can route it
      # away - the container simply retries the same bytes forever and the partition stops.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Deserialize only into our own packages. The default is to trust the class named in the
        # message headers, which lets a producer on the topic choose which class we instantiate.
        spring.json.trusted.packages: com.example.orders.kafka
        spring.json.value.default.type: com.example.orders.kafka.EventEnvelope
        # Ignore any type headers a producer sent and always use the type above, so a rename on
        # their side cannot break deserialization on ours.
        spring.json.use.type.headers: false
      # Bounded so one slow poll cannot exceed max.poll.interval.ms and trigger a rebalance.
      max-poll-records: 50
    listener:
      # Offsets are committed per record after the listener returns successfully. A batch ack would
      # re-deliver an entire batch when its last record failed.
      ack-mode: record
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all: the broker only confirms once every in-sync replica has the record. acks=1 would
      # confirm from the leader alone and lose the record if that leader died before replicating -
      # and the outbox row would already have been marked published.
      acks: all
      # Retry a transient send failure inside the client, before the outbox publisher has to.
      retries: 3
      properties:
        # Idempotent producer: a retry that succeeded but whose ack was lost does not append the
        # record twice. Required for exactly-once semantics on the broker side of a retry.
        enable.idempotence: true
        # With idempotence on, more than 5 in-flight requests would reorder records on retry.
        max.in.flight.requests.per.connection: 5
        # Do not put Java class names in message headers: consumers would couple to our packages.
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      # Prefixable per environment so a staging deployment cannot consume production's topic.
      orders: ${KAFKA_TOPIC_ORDERS:orders}
      # Defaults to <orders>.DLT when unset.
      orders-dead-letter: ${KAFKA_TOPIC_ORDERS_DLT:}

  outbox:
    # How often to drain the outbox. Latency for events, not for orders - order creation never waits
    # on Kafka.
    poll-interval: ${OUTBOX_POLL_INTERVAL:1000}

  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8090}
    connect-timeout: 1s
    # Below the 2s call timeout in ProductClient, so the socket gives up first and releases the
    # connection instead of the timeout abandoning a request that still holds one open.
    response-timeout: 1500ms

  jwt:
    # No default. The application must fail to start without JWT_SECRET rather than fall back to a
    # value that is committed to git - see JwtProperties.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:order-management-platform}
    expiration: ${JWT_EXPIRATION:15m}

resilience4j:
  circuitbreaker:
    instances:
      productService:
        # Count-based, not time-based: deterministic and far easier to reason about in a test.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Do not judge the upstream on one or two calls. Without a minimum, a single failure right
        # after startup is a 100% failure rate and opens the breaker.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # A call slower than this counts as a failure even if it eventually succeeds. A dependency
        # that answers in 4s is broken from the caller's point of view.
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        # Half-open lets a few probes through rather than reopening the floodgates at once, so a
        # still-broken upstream is not hit by the full load the instant the timer expires.
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          # A missing product is the upstream answering correctly. Counting 404s as failures would
          # let a client requesting bad ids in a loop open the breaker for everyone else.
          - com.example.orders.exception.ResourceNotFoundException
  retry:
    instances:
      productService:
        max-attempts: 3
        wait-duration: 200ms
        # Exponential backoff: fixed-interval retries from many callers re-synchronise into a
        # thundering herd that arrives together and knocks the recovering service over again.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Randomise the delay so retries from different instances do not land at the same instant.
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException$InternalServerError
          - org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout
        ignore-exceptions:
          # Never retry a 404 - the answer will not change, and three attempts only triple the load.
          - com.example.orders.exception.ResourceNotFoundException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Alphabetical rather than declaration order, so the page does not reshuffle when a method moves.
    operations-sorter: method
    tags-sorter: alpha
    # Collapsed by default: expanded, a dozen operations is a wall of text.
    doc-expansion: none
    # Keeps the token between page reloads, so you do not re-paste it after every refresh.
    persist-authorization: true
  # Actuator is intentionally absent from the document. It is infrastructure, not API, and in prod it
  # is not even on this port.
  show-actuator: false
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT:8080}
  error:
    # No stack traces or internal messages in error responses. Stage 13 replaces this with a
    # @ControllerAdvice and a single documented error contract.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # DEV ONLY. Exposes component details (db / redis / kafka) unauthenticated, which is how
      # stage 1 is verified. Stage 19 must change this to `when-authorized` before any deploy.
      show-details: always
      show-components: always
      # Which dependencies are allowed to stop traffic reaching this instance.
      #
      # The root /actuator/health aggregates everything and is for humans and dashboards - it
      # goes DOWN if any dependency is unhappy, which is what you want when debugging. What an
      # orchestrator probes is different, and must only include dependencies the service cannot
      # serve a request without:
      #
      #   db      -> in. No database, no orders. Nothing to fall back to.
      #   redis   -> out. A cache is an optimisation; stage 7 falls back to Postgres on a miss
      #              or an error. Failing readiness here would pull every instance out of the
      #              load balancer over a slower-but-correct path.
      #   kafka   -> out. This is exactly what the outbox pattern (stage 19) buys us: the order
      #              and its event commit to Postgres in one transaction, and the publisher
      #              drains the outbox when the broker returns. Order creation keeps working
      #              through a broker outage, so a broker outage must not stop traffic.
      #
      # Both stay visible on the root endpoint - excluded from readiness is not the same as
      # unmonitored. Alerting on them is stage 17's job.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    probes:
      enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      # Every request is traced in development. In production this belongs well below 1.0 - see
      # application-prod.yml - because tracing every request costs both throughput and storage.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  metrics:
    tags:
      # Stamped on every metric so a dashboard can tell instances and environments apart. Without
      # this, three instances' latencies average into one meaningless line.
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Histogram buckets for HTTP latency, so real percentiles can be computed across instances.
        # Client-side percentiles cannot be aggregated - averaging p99s is not a p99.
        http.server.requests: true

logging:
  level:
    root: INFO
    com.example.orders: DEBUG
  pattern:
    # traceId / spanId slots are wired properly in stage 17 (Micrometer Tracing). Until then the
    # MDC keys are simply empty, so the format does not have to change later.
    # traceId and spanId are populated by Micrometer Tracing; correlationId by CorrelationIdFilter.
    # Every line carries all three, so one grep follows a request across services and retries.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-},%X{spanId:-},%X{correlationId:-}] %-40.40logger{39} : %m%n"
